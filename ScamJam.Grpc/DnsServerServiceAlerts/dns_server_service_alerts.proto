syntax = "proto3";

package alerts_proto;

option csharp_namespace = "ScamJam.Grpc";

import "google/protobuf/empty.proto";

service DnsServerServiceAlerts {
  rpc Ui(stream DnsAlert) returns (google.protobuf.Empty);
}


enum Category {
  TIF = 0;
  POPUP = 1;
  DYN_DNS = 2;
  NRD = 3;
  TLD = 4;
  REMOTE = 5;
}

message DnsAlert {
  string hostname = 1;
  Category category = 2;
}