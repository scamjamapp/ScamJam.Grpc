syntax = "proto3";

package alerts_proto;

option csharp_namespace = "ScamJam.Grpc";

import "google/protobuf/empty.proto";

service ExecAlerts {
  rpc Exec(stream ExecAlert) returns (TrayReply);
}

service DnsAlerts {
  rpc Ui(stream DnsAlert) returns (TrayReply);
}


enum DnsCategory {
  TIF = 0;
  POPUP = 1;
  DYN_DNS = 2;
  NRD = 3;
  TLD = 4;
  REMOTE = 5;
}

message DnsAlert {
  string hostname = 1;
  DnsCategory category = 2;
}

message ExecAlert {
  optional string hostName = 1;
  optional string appName = 2;
  DnsCategory category = 3;
}


enum TrayUserResponse {
  ACKNOWLEDGE = 0;
  ALLOW_ONCE = 1;
  ALLOW_ADD_ALLOWLIST = 2;

}

message TrayReply {
  TrayUserResponse user_response = 1;
}